# Build and Release
#
# Builds the VSIX and per-agent skill ZIPs, attaches them to the GitHub Release.
# Triggered on push of a git tag matching v* (e.g. v1.0.0).
# Attachments: plugin .vsix + code-trace-tree-skill-<agent>-X.Y.Z.zip

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: main/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          yarn version --new-version "$VERSION" --no-git-tag-version

      - name: Package extension
        run: npx --yes @vscode/vsce package

      - name: Package agent skill ZIPs
        working-directory: .
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          python skills/package_skills.py --zip --version "$VERSION"
          ls -la dist/skills/
          unzip -l "dist/skills/code-trace-tree-skill-claude-${VERSION}.zip"
          echo "SKILL_DIR=dist/skills" >> "$GITHUB_ENV"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree
          path: main/*.vsix

      - name: Upload skill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree-skill
          path: dist/skills/code-trace-tree-skill-*.zip

      - name: Attach artifacts to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          VSIX="$(ls main/*.vsix | head -n1)"
          TITLE="Code Trace Tree ${TAG}"
          mapfile -t SKILL_ZIPS < <(ls dist/skills/code-trace-tree-skill-*.zip)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "${SKILL_ZIPS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "" \
              "$VSIX" \
              "${SKILL_ZIPS[@]}"
          fi
