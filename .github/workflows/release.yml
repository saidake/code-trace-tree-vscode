# Build and Release
#
# Builds the VSIX and Claude skill ZIP, attaches both to the GitHub Release.
# Triggered on push of a git tag matching v* (e.g. v1.0.0).
# Attachments: plugin .vsix + code-trace-tree-skill-X.Y.Z.zip

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: main/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          yarn version --new-version "$VERSION" --no-git-tag-version

      - name: Package extension
        run: npx --yes @vscode/vsce package

      - name: Package Claude skill ZIP
        working-directory: .
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          SKILL_ZIP="code-trace-tree-skill-${VERSION}.zip"
          STAGE="$(mktemp -d)"
          cp -a .claude/skills/code-trace-tree "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$SKILL_ZIP" code-trace-tree)
          echo "SKILL_ZIP=$SKILL_ZIP" >> "$GITHUB_ENV"
          ls -la "$SKILL_ZIP"
          unzip -l "$SKILL_ZIP"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree
          path: main/*.vsix

      - name: Upload Claude skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree-skill
          path: code-trace-tree-skill-*.zip

      - name: Attach artifacts to GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          VSIX="$(ls main/*.vsix | head -n1)"
          SKILL_ZIP="${SKILL_ZIP:-code-trace-tree-skill-${VERSION}.zip}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "$SKILL_ZIP" --clobber
          else
            gh release create "$TAG" \
              --title "Code Trace Tree ${TAG#v}" \
              --generate-notes \
              "$VSIX" \
              "$SKILL_ZIP"
          fi
